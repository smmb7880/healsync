<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22d3ee;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <circle cx="256" cy="256" r="250" fill="#03080c" stroke="#22d3ee" stroke-width="4" stroke-opacity="0.3"/>
  <!-- Medical Cross -->
  <rect x="216" y="120" width="80" height="272" rx="16" fill="url(#cyanGrad)" opacity="0.9" filter="url(#glow)"/>
  <rect x="120" y="216" width="272" height="80" rx="16" fill="url(#cyanGrad)" opacity="0.9" filter="url(#glow)"/>
  <!-- Heartbeat Pulse Line -->
  <polyline points="100,256 180,256 200,256 220,200 240,310 260,180 280,256 300,256 412,256" 
    fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" 
    opacity="0.95" filter="url(#glow)"/>
  <!-- Circuit Nodes -->
  <circle cx="180" cy="256" r="6" fill="#22d3ee" opacity="0.8"/>
  <circle cx="300" cy="256" r="6" fill="#22d3ee" opacity="0.8"/>
  <circle cx="256" cy="180" r="5" fill="#22d3ee" opacity="0.6"/>
  <circle cx="256" cy="332" r="5" fill="#22d3ee" opacity="0.6"/>
</svg>